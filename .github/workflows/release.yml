name: Release Windows App

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: '可选：创建或更新指定版本的 GitHub Release（如 v0.5.0）'
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  package-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Build Frontend SPA
        working-directory: frontend
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pip install -e ".[dev,packaging]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Automated Test Suite
        run: pytest -v

      - name: Build & Smoke-Test Windows Executable + Zip
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build_windows.ps1 -SkipFrontendBuild

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BidGuard-Windows-x64
          path: release/BidGuard-Windows-x64.zip*
          if-no-files-found: error

      - name: Publish GitHub Release Assets
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release/BidGuard-Windows-x64.zip
            release/BidGuard-Windows-x64.zip.sha256
